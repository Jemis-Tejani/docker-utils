# ==============================================================================
# Hermes Platform - Spark Lakehouse Configuration (Local Docker)
# Tuned for laptop local-dev: keep functionality, cap RAM/CPU. Not used in prod.
# ==============================================================================

# REST API & Cluster
spark.master.rest.enabled=true

# Hermes Core SQL Extensions (Iceberg, Delta, Policy/Masking, Deduplication, CatalogRegister)
spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,com.dataphion.spark.policy.PolicySparkExtension,io.delta.sql.DeltaSparkSessionExtension,com.iidrak.spark.dedup.DeduplicationUDF,com.Nexaris.spark.CatalogRegister

# Default Catalog
spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog

# Strapi CMS & Policy Engine Connectivity
spark.strapi.url=http://host.docker.internal:1337
spark.nexaris.strapi.url=http://host.docker.internal:1337
spark.policy.validate=false
spark.policy.bypass.internal=true
# Keycloak client credentials for CatalogRegister live in spark-defaults.local.conf
# (gitignored). Copy from spark-defaults.local.conf.example and fill from hermes-cms App Config.

# Spark Connect Server Binding
spark.connect.grpc.binding.address=0.0.0.0
spark.connect.grpc.binding.port=15002

# Local Resource Tuning (laptop-safe; keep in sync with compose SPARK_* + mem_limit)
# Entrypoint / spark-submit CLI may override memory; these are the baseline defaults.
spark.driver.memory=512m
spark.driver.maxResultSize=128m
# Spark 4 minimum executor memory is ~450m
spark.executor.memory=512m
spark.executor.cores=1
spark.executor.instances=1
spark.sql.shuffle.partitions=2
spark.default.parallelism=1
spark.cores.max=1
spark.ui.showConsoleProgress=false


# Storage Directories inside Container
spark.sql.warehouse.dir=/app/spark-iidrak/warehouse
spark.local.dir=/app/spark-iidrak/spark-tmp
# Event logs off locally to reduce disk churn; enable when debugging jobs
spark.eventLog.enabled=false
spark.eventLog.dir=file:///app/spark-iidrak/spark-events
spark.history.fs.logDirectory=file:///app/spark-iidrak/spark-events
