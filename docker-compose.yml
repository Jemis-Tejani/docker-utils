services:
  keycloak:
    image: harbor-registry.dataphion.com/iidrak/keycloak:latest-arm64
    ports:
      - "8080:8080"
    environment:
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak-data:/opt/keycloak/data
    command: start --hostname-strict=false

  spark:
    image: apache/spark:4.0.0
    user: root
    ports:
      - "15002:15002"
      - "4040:4040"
    environment:
      SPARK_LOCAL_DIRS: /opt/spark/persistent/local
    volumes:
      - ./spark-data:/opt/spark/persistent
      - /var/folders:/var/folders
    command: >
      /opt/spark/bin/spark-submit
      --class org.apache.spark.sql.connect.service.SparkConnectServer
      --conf spark.sql.warehouse.dir=/opt/spark/persistent/warehouse
      --conf spark.local.dir=/opt/spark/persistent/local
      --conf spark.jars.ivy=/opt/spark/persistent/ivy
      local:///opt/spark/jars/spark-connect_2.13-4.0.0.jar

  redis:
    image: redis:8.8.0
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    command: redis-server --appendonly yes

  registry:
    image: registry:2
    ports:
      - "5001:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - ./registry-data:/var/lib/registry

  pgvector:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d
    command: postgres -c shared_preload_libraries=pg_stat_statements

  ngrok:
    image: ngrok/ngrok:latest
    ports:
      - "4041:4040"
    environment:
      NGROK_AUTHTOKEN: "39bpO7wkGqbRYfezbBxVrJIkrko_6kfNacgJkcbNcLqttpCiA"
    volumes:
      - ./ngrok-data:/var/lib/ngrok
    command: >
      http
      --config=/var/lib/ngrok/ngrok.yml
      --url=micrometrical-patronymically-jarvis.ngrok-free.dev
      --host-header=rewrite
      host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

  chromadb:
    image: chromadb/chroma:1.5.3
    container_name: local-chromadb
    profiles: ["optional"]
    ports:
      - "8000:8000"
    volumes:
      - ./chromadb-data:/data

  # ==============================================================================
  # Local Catalog Connectors (Profile: "connectors")
  # Start individually: docker compose up -d <service_name>
  # Start all connectors: docker compose --profile connectors up -d
  # ==============================================================================

  mysql:
    image: mysql:8.0
    container_name: local-mysql
    profiles: ["connectors"]
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testdb
    volumes:
      - ./mysql-data:/var/lib/mysql

  mongodb:
    image: mongo:7.0
    container_name: local-mongodb
    profiles: ["connectors"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: testdb
    volumes:
      - ./mongodb-data:/data/db

  mssql:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: local-mssql
    profiles: ["connectors"]
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password@123"
      MSSQL_PID: "Developer"
    volumes:
      - ./mssql-data:/var/opt/mssql

  presto:
    image: prestodb/presto:latest
    container_name: local-presto
    profiles: ["connectors"]
    ports:
      - "8089:8080"

  trino:
    image: trinodb/trino:latest
    container_name: local-trino
    profiles: ["connectors"]
    ports:
      - "8082:8080"

  sybase:
    image: datagrip/sybase:16.0
    container_name: local-sybase
    platform: linux/amd64
    profiles: ["connectors"]
    ports:
      - "5002:5000"

