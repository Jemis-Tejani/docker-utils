version: 3
agent:
    web_addr: 0.0.0.0:4040
endpoints:
  - name: ollama
    # Default: ngrok automatically assigns a free/random URL for your account.
    # If you have a reserved custom/static domain, uncomment and specify it here
    # (or create ngrok-data/ngrok.local.yml for local overrides):
    # url: https://your-domain.ngrok-free.dev
    upstream:
      url: http://host.docker.internal:11434
    traffic_policy:
      on_http_request:
        - actions:
            - type: add-headers
              config:
                headers:
                  host: localhost:11434
